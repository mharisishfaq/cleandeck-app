name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    name: Generate & Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install project dependencies
        run: npm install --legacy-peer-deps

      - name: 🏗️ Generate native Android project via Expo Prebuild
        run: npx expo prebuild --platform android --clean

      - name: 🔑 Set Gradle wrapper executable permissions
        run: chmod +x android/gradlew

      - name: 🚀 Compile Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📤 Upload CleanDeck Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanDeck-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Generate & Compile Lightweight Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --clean

      - name: Ensure universal debug signing for release
        run: |
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/app/build.gradle || true

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Compile Release APK (arm64-v8a + Hermes minification)
        run: |
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace

      - name: Upload CleanDeck Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanDeck-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14
